[package]
name = "jojodiff-cli-rs"
version = "0.8.5"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Independent Rust port of JojoDiff 0.8.5: byte-compatible jdiff binary diff/patch CLI (single binary; jpatch/jptch patch via -u or argv[0] dispatch; not affiliated with the jojodiff crate)"
repository = "https://github.com/ar-nim/jojodiff-cli-rs"
readme = "README.md"
keywords = ["jojodiff", "binary-diff", "patch", "cli", "diff"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Arif Rahman Ibrahim <1311330+ar-nim@users.noreply.github.com>"]

[lib]
name = "jojodiff_cli_rs"

[[bin]]
name = "jdiff"
path = "src/bin/jdiff.rs"

# One binary (spec §21.2): patching is `jdiff -u` or an argv[0] dispatch —
# copies/links of the binary named jpatch*/jptch* patch. The 0.8.1 jptch
# [[bin]] target is gone; scripts migrate with `ln -s jdiff jptch`.

[features]
default = []
debug = []

[lints.rust]
future-incompatible = "deny"

[lints.clippy]
cast_lossless = "deny"

# Deliberately NOT enabled (spec §15): cast_possible_truncation,
# cast_sign_loss, cast_possible_wrap — the port's narrowing arithmetic is
# byte-pinned to JojoDiff 0.8.5 C++ behavior — and pedantic-at-large.

[dependencies]
# First runtime dependency (spec §13 dependency record): `thiserror` derives
# the `Display`/`std::error::Error` impls of the library-wide `JDiffError`
# (src/error.rs). Compile-time (derive) only — the port stays otherwise
# std-only, and every diagnostic byte remains hand-pinned.
thiserror = "2"

# Second runtime dependency: the thin `jdiff` binary (src/bin/jdiff.rs) wraps
# `cli::run`'s `Result` in `anyhow` (spec §8.1). The library itself stays
# std-only apart from `thiserror`; `JDiffError` crosses into `anyhow::Error`
# via its `std::error::Error + Send + Sync + 'static` impls.
anyhow = "1"

[dev-dependencies]
pretty_assertions = "1.4"
jojodiff = "0.1.2"   # francisdb crate, cross-validation only (tests/oracle.rs)
