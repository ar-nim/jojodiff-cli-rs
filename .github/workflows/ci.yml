name: ci

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release

  oracle:
    # Ubuntu-only: builds the vendored C++ reference (scripts/build-oracle.sh
    # applies the spec §15.1 + §15.12 patches) and byte-compares the Rust
    # tools against it across the spec §13 matrix (tests/oracle.rs layer 2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y g++ make
      - run: scripts/build-oracle.sh
      - run: cargo test --all-features
        env:
          JOJODIFF_ORACLE: target/oracle

  msrv:
    # Declared MSRV (edition 2024 floor).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check
