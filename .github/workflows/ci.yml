name: ci

# One run per change: PRs run on the pull_request event only (a branch
# push does not double-trigger), pushes run only on main (post-merge /
# direct commits).
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded in-progress runs when new commits land on the same
# branch instead of stacking full suites.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo build --release

  oracle:
    # Ubuntu-only: builds the vendored C++ 0.8.5 reference (scripts/
    # build-oracle.sh applies the spec §21.7 hkey patch and makes
    # JDIFF_LARGEFILE live) and byte-compares the Rust tools against it
    # across the spec §22.1 matrix (tests/oracle.rs layer 4: patches,
    # verbose stderr, cross-applies and the corpus-pair listings). The
    # committed golden85 layer (tests/oracle.rs layer 2) and the
    # cross-version 0.8.1 gate (tests/crossver.rs, layer 3, §22.3) run
    # everywhere in the matrix job above without the oracle.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y g++ make
      - run: scripts/build-oracle.sh
      - run: cargo test --all-features
        env:
          # $JOJODIFF_ORACLE is what tests/oracle.rs reads (a directory
          # holding `jdiff`; relative values are canonicalized by the test).
          JOJODIFF_ORACLE: target/oracle

  msrv:
    # Declared MSRV (edition 2024 floor).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check
